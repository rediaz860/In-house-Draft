<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-House Draft</title>
    <script>
        // Improved player selection functionality
        let selectedPlayers = [];

        function selectPlayer(player) {
            if (!selectedPlayers.includes(player)) {
                selectedPlayers.push(player);
                displaySelectedPlayers();
            }
        }

        function removePlayer(player) {
            selectedPlayers = selectedPlayers.filter(p => p !== player);
            displaySelectedPlayers();
        }

        function displaySelectedPlayers() {
            const selectedList = document.getElementById('selectedPlayers');
            selectedList.innerHTML = '';
            selectedPlayers.forEach(player => {
                const li = document.createElement('li');
                li.innerText = player;
                const removeButton = document.createElement('button');
                removeButton.innerText = 'Remove';
                removeButton.onclick = () => removePlayer(player);
                li.appendChild(removeButton);
                selectedList.appendChild(li);
            });
        }
    </script>
</head>
<body>
    <h1>In-House Draft</h1>
    <h2>Coaches:</h2>
    <ul>
        <li onclick="selectPlayer('Coach Diamond')">Coach Diamond</li>
        <li onclick="selectPlayer('Coach Rich')">Coach Rich</li>
        <li onclick="selectPlayer('Coach George')">Coach George</li>
        <li onclick="selectPlayer('Coach Jonas')">Coach Jonas</li>
        <li onclick="selectPlayer('Coach Brennen')">Coach Brennen</li>
        <li onclick="selectPlayer('Coach Six')">Coach Six</li>
    </ul>
    <h2>Selected Coaches:</h2>
    <ul id="selectedPlayers"></ul>
</body>
</html>
